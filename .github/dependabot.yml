# Dependency updates.
#
# Grouped and monthly on purpose: this project has a small, deliberate dependency surface, and a
# PR per patch bump would train everyone to merge without reading. Security updates are NOT
# governed by this file — GitHub raises those immediately regardless of schedule.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # Was 5. The first triage of these PRs found the cost of that: tonic-build had a PR of its
    # own bumping it 0.11 → 0.14 while tonic stayed at 0.11 and prost at 0.12 — an upgrade that
    # cannot work, because the code tonic-build generates targets the tonic it shipped with. The
    # PRs for the other two halves were never opened: the five slots were already taken. A limit
    # that low does not just delay updates, it makes a broken half look like the whole thing.
    open-pull-requests-limit: 10
    groups:
      # Coupled by construction, and both couplings were found the hard way. A dependency lands
      # in the FIRST group it matches, so these precede the catch-all deliberately.
      grpc-stack:
        patterns: ["tonic", "tonic-*", "prost", "prost-*"]
      ast-stack:
        # prettyplease 0.3 requires syn 3; the API-surface gate parses with both.
        patterns: ["syn", "prettyplease", "quote", "proc-macro2"]
      rust-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /vscode-plugin
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    # No esbuild hold here any more. There used to be one, ignoring
    # `version-update:semver-major`, with a comment explaining that esbuild majors were held
    # because of an advisory against `esbuild serve` — which this project never runs. The rule
    # did nothing: esbuild is 0.x, so semver-major means 0.x → 1.x, and every bump it was meant
    # to stop (0.18 → 0.28 among them) sailed straight past it as a minor. A rule that does not
    # do what its comment claims is worse than no rule, because everyone stops looking.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
