# CI for the FreeCode workspace: the Rust daemon/CLI/crates and the VS Code extension.
# The repo already had 98 green tests and a clean clippy — nothing enforced them on push.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (build / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `tonic-build` shells out to protoc to compile proto/freecode.proto; both build.rs
      # files fail without it. Not bundled with the runner image.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # --locked: fail if Cargo.lock is stale rather than silently resolving new versions.
      - name: Build (locked)
        run: cargo build --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked | tee /tmp/test.out

      # Report the suite's shape, do not gate on it.
      #
      # This step used to fail the build when the README's stated test count disagreed with the
      # run. That guard was wrong: it enforced a number that is not a single fact about the
      # repository — the same tree counted 134 locally and 115 here — so it turned a
      # documentation nicety into a red build. The README no longer states a count; this prints
      # one so a sudden drop is visible in the log without blocking anything.
      - name: Test suite shape
        run: |
          total=$(grep -oE '[0-9]+ passed' /tmp/test.out | awk '{s+=$1} END {print s}')
          echo "tests passed on ${{ runner.os }}: $total"
          grep -E 'Running unittests|Doc-tests|test result' /tmp/test.out || true

  extension:
    name: vscode extension (typecheck / bundle / audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json

      # `npm ci` is lockfile-exact and fails on any package.json/lock drift.
      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The model → DOM escaping boundary (escapeHtml / encArg / parseMarkdown). These live
      # inside the webview template literal, so the suite evaluates it under stubs to reach them.
      - name: Test
        run: npm test

      # Also runs the webview-JS syntax guard in esbuild.js — a stray escape there
      # silently kills the whole panel at runtime.
      - name: Bundle
        run: node esbuild.js

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  airgap:
    name: air-gap guard (no external CDN/CDN fonts in shipped code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FreeCode is local-first: shipped source must not reference a remote asset host.
      # A Google Fonts @import had been living in the webview CSS unnoticed.
      - name: Reject remote asset hosts
        run: |
          if git grep -nE 'https?://(fonts\.googleapis|fonts\.gstatic|cdn\.|unpkg\.com|cdnjs\.|jsdelivr)' \
               -- 'daemon/**' 'cli/**' 'crates/**' 'vscode-plugin/src/**'; then
            echo "::error::remote asset host referenced in shipped source (air-gap violation)"
            exit 1
          fi
          echo "no remote asset hosts — ok"
