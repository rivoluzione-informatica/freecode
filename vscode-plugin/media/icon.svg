<!--
  Activity-bar icon: the standard terminal prompt, `>_`.

  Monochrome and `currentColor` because VS Code MASKS this into a single theme colour — any
  fill, gradient or opacity here is discarded. Colour lives only in media/icon.png, which is
  not masked.

  Two shapes, nothing else. Anything more collapses at 24px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="currentColor" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
  <path d="m5 7 5 5-5 5"/>
  <path d="M13 17h6"/>
</svg>
