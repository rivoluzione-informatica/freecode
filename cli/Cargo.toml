[package]
name = "freecode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tonic = "0.14"
# tonic 0.14 scorpora il codec prost in una crate a parte; senza questa il servizio
# generato non ha un Codec e non compila.
tonic-prost = "0.14"
prost = "0.14"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tonic-prost-build = "0.14"
